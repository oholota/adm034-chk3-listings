name: Vehicle Assembly

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Print start message
        run: echo "Starting assembly of the vehicles"

  build_car:
    needs: start
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Assemble car
        run: |
          mkdir -p build
          echo "Chassis" > build/car.txt
          echo "Engine" >> build/car.txt
          echo "Wheels" >> build/car.txt
          echo "Body Frame and Doors" >> build/car.txt
          echo "Lights and Indicators" >> build/car.txt
          echo "Winter wheels for car" > build/spare_parts_car.txt
          echo "Car Assembly Completed!"
          cat build/car.txt

      - name: Create invoice
        run: echo "Invoice for car" > build/invoice_car.txt

      - name: Upload car artifact
        uses: actions/upload-artifact@v6
        with:
          name: car-files
          path: |
            build/car.txt
            build/spare_parts_car.txt
          retention-days: 1

  build_motorbike:
    needs: start
    runs-on: ubuntu-latest
    steps:
      - name: Assemble motorbike
        run: |
          mkdir -p build
          echo "Frame" > build/motorbike.txt
          echo "Engine" >> build/motorbike.txt
          echo "Wheels" >> build/motorbike.txt
          echo "Handlebars" >> build/motorbike.txt
          echo "Seat" >> build/motorbike.txt
          echo "Fuel Tank" >> build/motorbike.txt
          echo "Winter wheels for motorbike" > build/spare_parts_motorbike.txt
          echo "Motorbike Assembly Completed!"
          cat build/motorbike.txt

      - name: Create invoice
        run: echo "Invoice for motorbike" > build/invoice_motorbike.txt

      - name: Upload motorbike artifact
        uses: actions/upload-artifact@v6
        with:
          name: motorbike-files
          path: |
            build/motorbike.txt
            build/spare_parts_motorbike.txt
          retention-days: 1

  build_truck:
    needs: start
    runs-on: ubuntu-latest
    steps:
      - name: Assemble truck
        run: |
          mkdir -p build
          echo "Chassis" > build/truck.txt
          echo "Engine" >> build/truck.txt
          echo "Wheels" >> build/truck.txt
          echo "Cargo Bed" >> build/truck.txt
          echo "Cabin" >> build/truck.txt
          echo "Winter wheels for truck" > build/spare_parts_truck.txt
          echo "Truck Assembly Completed!"
          cat build/truck.txt

      - name: Create invoice
        run: echo "Invoice for truck" > build/invoice_truck.txt

      - name: Upload truck artifact
        uses: actions/upload-artifact@v6
        with:
          name: truck-files
          path: |
            build/truck.txt
            build/spare_parts_truck.txt
          retention-days: 1

  test_car:
    needs: build_car
    runs-on: ubuntu-latest
    steps:
      - name: Download car artifact
        uses: actions/download-artifact@v7
        with:
          name: car-files
          path: build/

      - name: Test car
        run: |
          mkdir -p results
          check() {
            if "${@:2}"; then result=pass; else result=fail; fi
            echo "| Car | $1 | $result |" >> results/car.md
          }
          check "car.txt exists" test -f build/car.txt
          check "Engine in car.txt" grep -q "Engine" build/car.txt
          check "spare parts list" grep -q "car" build/spare_parts_car.txt
          cat results/car.md
          ! grep -qF "| fail |" results/car.md

      - name: Upload car test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-car
          path: results/

  test_motorbike:
    needs: build_motorbike
    runs-on: ubuntu-latest
    steps:
      - name: Download motorbike artifact
        uses: actions/download-artifact@v7
        with:
          name: motorbike-files
          path: build/

      - name: Test motorbike
        run: |
          mkdir -p results
          check() {
            if "${@:2}"; then result=pass; else result=fail; fi
            echo "| Motorbike | $1 | $result |" >> results/motorbike.md
          }
          check "motorbike.txt exists" test -f build/motorbike.txt
          check "Fuel Tank in motorbike.txt" grep -q "Fuel Tank" build/motorbike.txt
          check "spare parts list" grep -q "motorbike" build/spare_parts_motorbike.txt
          cat results/motorbike.md
          ! grep -qF "| fail |" results/motorbike.md

      - name: Upload motorbike test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-motorbike
          path: results/

  test_truck:
    needs: build_truck
    runs-on: ubuntu-latest
    steps:
      - name: Download truck artifact
        uses: actions/download-artifact@v7
        with:
          name: truck-files
          path: build/

      - name: Test truck
        run: |
          mkdir -p results
          check() {
            if "${@:2}"; then result=pass; else result=fail; fi
            echo "| Truck | $1 | $result |" >> results/truck.md
          }
          check "truck.txt exists" test -f build/truck.txt
          check "Cargo Bed in truck.txt" grep -q "Cargo Bed" build/truck.txt
          check "spare parts list" grep -q "truck" build/spare_parts_truck.txt
          cat results/truck.md
          ! grep -qF "| fail |" results/truck.md

      - name: Upload truck test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-truck
          path: results/

  test_all:
    needs: [build_car, build_motorbike, build_truck]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: build/

      - name: Test all vehicles present, invoices excluded
        run: |
          test -f build/car.txt
          test -f build/motorbike.txt
          test -f build/truck.txt
          test ! -f build/invoice_car.txt
          test ! -f build/invoice_motorbike.txt
          test ! -f build/invoice_truck.txt
          echo "All vehicles assembled and invoices correctly excluded!"

  deploy_car:
    needs: test_car
    runs-on: ubuntu-latest
    steps:
      - name: Download car artifact
        uses: actions/download-artifact@v7
        with:
          name: car-files
          path: build/

      - name: Deploy car
        run: |
          echo "Deploying car to production"
          cat build/car.txt

      - name: Upload failure artifact
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: car-files-failure
          path: build/car.txt
          retention-days: 3

  deploy_motorbike:
    needs: test_motorbike
    runs-on: ubuntu-latest
    steps:
      - name: Download motorbike artifact
        uses: actions/download-artifact@v7
        with:
          name: motorbike-files
          path: build/

      - name: Deploy motorbike
        run: |
          echo "Deploying motorbike to production"
          cat build/motorbike.txt

      - name: Upload failure artifact
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: motorbike-files-failure
          path: build/motorbike.txt
          retention-days: 3

  deploy_truck:
    needs: test_truck
    runs-on: ubuntu-latest
    steps:
      - name: Download truck artifact
        uses: actions/download-artifact@v7
        with:
          name: truck-files
          path: build/

      - name: Deploy truck
        run: |
          echo "Deploying truck to production"
          cat build/truck.txt

      - name: Upload failure artifact
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: truck-files-failure
          path: build/truck.txt
          retention-days: 3

  quality_report:
    needs: [build_car, build_motorbike, build_truck, test_car, test_motorbike, test_truck, test_all, deploy_car, deploy_motorbike, deploy_truck]
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Force a failure
        run: exit 1

      - name: Download test results
        uses: actions/download-artifact@v7
        with:
          pattern: test-results-*
          merge-multiple: true
          path: results/

      - name: Write the pipeline summary
        env:
          BUILD_CAR: ${{ needs.build_car.result }}
          BUILD_MOTORBIKE: ${{ needs.build_motorbike.result }}
          BUILD_TRUCK: ${{ needs.build_truck.result }}
          TEST_CAR: ${{ needs.test_car.result }}
          TEST_MOTORBIKE: ${{ needs.test_motorbike.result }}
          TEST_TRUCK: ${{ needs.test_truck.result }}
          DEPLOY_CAR: ${{ needs.deploy_car.result }}
          DEPLOY_MOTORBIKE: ${{ needs.deploy_motorbike.result }}
          DEPLOY_TRUCK: ${{ needs.deploy_truck.result }}
          TEST_ALL: ${{ needs.test_all.result }}
        run: |
          echo "## Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "| Vehicle | Build | Test | Deploy |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Car | $BUILD_CAR | $TEST_CAR | $DEPLOY_CAR |" >> $GITHUB_STEP_SUMMARY
          echo "| Motorbike | $BUILD_MOTORBIKE | $TEST_MOTORBIKE | $DEPLOY_MOTORBIKE |" >> $GITHUB_STEP_SUMMARY
          echo "| Truck | $BUILD_TRUCK | $TEST_TRUCK | $DEPLOY_TRUCK |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All vehicles together (test_all): $TEST_ALL" >> $GITHUB_STEP_SUMMARY
          echo "## Test details" >> $GITHUB_STEP_SUMMARY
          echo "| Vehicle | Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          cat results/*.md >> $GITHUB_STEP_SUMMARY || echo "No test results found." >> $GITHUB_STEP_SUMMARY
